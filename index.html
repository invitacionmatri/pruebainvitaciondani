<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuestra Boda | Sofía & Lucas</title>
  
  <!-- Tipografías de Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --color-principal: #5c6b57; /* Verde oliva suave */
      --color-acento: #d4af37;    /* Dorado suave */
      --color-fondo: #fcfbf7;     /* Blanco cálido */
      --color-texto: #333333;
      --color-tarjeta: #ffffff;
      --fuente-titulo: 'Cormorant Garamond', serif;
      --fuente-cuerpo: 'Montserrat', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--color-fondo);
      color: var(--color-texto);
      font-family: var(--fuente-cuerpo);
      line-height: 1.6;
      display: flex;
      justify-content: center;
      padding: 20px 10px;
    }

    .contenedor-invitacion {
      max-width: 600px;
      width: 100%;
      background: var(--color-tarjeta);
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
      overflow: hidden;
      border: 1px solid #eaeaea;
      text-align: center;
      padding: 40px 20px;
    }

    h1, h2, h3 {
      font-family: var(--fuente-titulo);
      font-weight: 600;
      color: var(--color-principal);
    }

    .header-nombres {
      font-size: 2.8rem;
      margin-bottom: 5px;
    }

    .subtitulo {
      font-size: 1.1rem;
      color: #777;
      margin-bottom: 30px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .seccion {
      margin: 40px 0;
      padding: 20px 0;
      border-bottom: 1px solid #f0f0f0;
    }

    .seccion:last-child {
      border-bottom: none;
    }

    .seccion-titulo {
      font-size: 1.8rem;
      margin-bottom: 15px;
    }

    /* Imagen o GIF decorativo principal */
    .banner-img {
      width: 100%;
      max-height: 250px;
      object-fit: cover;
      border-radius: 10px;
      margin-bottom: 25px;
    }

    /* Botones Interactivos de Asistencia (RSVP) con Hover GIF */
    .contenedor-rsvp {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 25px;
      flex-wrap: wrap;
    }

    .opcion-asistencia {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 220px;
    }

    .contenedor-gif {
      width: 130px;
      height: 130px;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .contenedor-gif img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      transition: transform 0.3s ease;
    }

    .opcion-asistencia:hover .contenedor-gif img {
      transform: scale(1.08);
    }

    .btn {
      display: inline-block;
      padding: 12px 24px;
      border-radius: 30px;
      border: none;
      font-family: var(--fuente-cuerpo);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.3s ease;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
    }

    .btn-confirmar {
      background-color: var(--color-principal);
      color: white;
    }

    .btn-confirmar:hover {
      background-color: #4a5745;
    }

    .btn-declinar {
      background-color: #888888;
      color: white;
    }

    .btn-declinar:hover {
      background-color: #666666;
    }

    .btn-ubicacion {
      background-color: #ffffff;
      color: var(--color-principal);
      border: 2px solid var(--color-principal);
    }

    .btn-ubicacion:hover {
      background-color: var(--color-principal);
      color: white;
    }

    .btn-spotify {
      background-color: #1DB954;
      color: white;
    }

    .btn-spotify:hover {
      background-color: #179843;
    }

    /* Caja Código Novios */
    .caja-novios {
      background-color: #f7f9f6;
      border: 1px dashed var(--color-principal);
      padding: 20px;
      border-radius: 10px;
      margin: 20px 0;
      cursor: pointer;
      transition: background 0.3s;
    }

    .caja-novios:hover {
      background-color: #eef2ec;
    }

    .codigo-texto {
      font-size: 1.4rem;
      font-weight: 600;
      letter-spacing: 3px;
      color: var(--color-principal);
      margin: 5px 0;
    }
